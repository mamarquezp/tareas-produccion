# Tres piezas: la base, el caché y el visor de trazas.
# Puertos corridos a propósito para no chocar con nada de semanas anteriores.
services:
  db:
    image: postgres:17-alpine
    container_name: s17-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tareas
    ports: ['5436:5432']
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tareas']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: s17-redis
    ports: ['6380:6379']
    command: ['redis-server', '--save', '', '--appendonly', 'no']

  # Jaeger recibe OTLP directamente: no hace falta un colector aparte.
  # Interfaz web en http://localhost:16686
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
    container_name: s17-jaeger
    ports:
      - '16686:16686'   # interfaz web
      - '4317:4317'     # OTLP gRPC
      - '4318:4318'     # OTLP HTTP
